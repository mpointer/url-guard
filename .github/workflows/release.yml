name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG" >&2
            exit 1
          fi
      - run: npm install -g npm@11.21.1 # OIDC trusted publishing needs npm >= 11.5
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      - name: Skip when this version is already on npm (the first release is published by hand)
        id: npm_exists
        run: |
          PKG=$(node -p "require('./package.json').version")
          if npm view "@mpointer/url-guard@$PKG" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@mpointer/url-guard@$PKG is already published; skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm_exists.outputs.exists != 'true'
        run: npm publish --provenance --access public

  publish-pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify tag matches python/pyproject.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(python -c "import tomllib; print(tomllib.load(open('python/pyproject.toml', 'rb'))['project']['version'])")
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match python/pyproject.toml version $PKG" >&2
            exit 1
          fi
      - run: pip install ./python pytest build urllib3 # urllib3: the parser requests uses; tests assert agreement
      - run: pytest python/tests -q
      - run: python -m build python --outdir dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3; OIDC trusted publishing; no token stored
        with:
          skip-existing: true
