[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "url-guard"
version = "0.2.0"
description = "SSRF guard for outbound URLs: canonical IP-literal parsing in every encoding, private/metadata/link-local classification, DNS-resolved validation, HTTPS and host allow-list rules. Zero dependencies. Wire-identical to the @mpointer/url-guard npm package."
readme = "README.md"
license = "MIT"
authors = [{ name = "Michael Pointer", email = "mpointer@gmail.com" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["ssrf", "security", "url", "metadata", "private-ip", "egress", "allowlist", "httpx", "requests"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/mpointer/url-guard"
Issues = "https://github.com/mpointer/url-guard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/url_guard"]

[tool.ruff]
target-version = "py310" # keeps fixes valid on 3.10 (asyncio.TimeoutError is not TimeoutError there)

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# reason_of(lambda: ...) calls the lambda immediately, so late binding of the
# loop variable cannot bite.
"tests/*" = ["B023"]

[tool.mypy]
strict = true
